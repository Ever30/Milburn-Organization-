<style>
body{margin:0;background:#EEF0F2;color:#14181C;font:20px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:34px;margin:0 0 8px}h2{font-size:24px;margin:24px 0 10px}
button{font:600 20px system-ui,sans-serif;min-height:56px;border-radius:8px;border:2px solid #9AA3AB;background:#fff;color:#14181C;padding:0 16px;width:100%;margin-bottom:8px;text-align:left}
.sel{background:#14181C;color:#fff;border:2px solid #14181C}.dim{opacity:.4}
.p{background:#1F4E79;color:#fff;border:0;text-align:center;min-height:64px}
.g{background:#1E7B3A;color:#fff;border:0}.y{background:#F2B705;border:0}.r{background:#C62828;color:#fff;border:0}
.g.sel,.y.sel,.r.sel{border:6px solid #14181C}.y.sel{color:#14181C}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid button{text-align:center;margin:0}
input,textarea,select{width:100%;box-sizing:border-box;font:20px system-ui,sans-serif;padding:12px;border:2px solid #14181C;border-radius:8px;margin-bottom:10px}
.card{background:#fff;border:1px solid #C9CED3;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.m{color:#4A545C;font-size:16px}.big{text-align:center;font-size:28px;padding:40px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #14181C;margin-right:6px;vertical-align:middle}
.qg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.qg .card{text-align:center}
.dl{color:#C62828;border-color:#C62828;margin-top:8px}
@media print{button,.nop{display:none!important}body{background:#fff}}
.fb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:0;border-radius:0;border:0;border-bottom:2px solid #14181C;min-height:60px}
.bld{border:3px solid #14181C;background:#fff;max-width:520px;margin:0 auto}.roof{height:18px;background:#262626}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:55%}.chips i{width:20px;height:20px;border:2px solid #14181C;display:inline-block}
.ground{height:10px;background:#4A545C;max-width:560px;margin:0 auto}
.photo{display:block;border:2px dashed #14181C;border-radius:8px;padding:16px;text-align:center;font-weight:600;margin-bottom:10px;background:#fff}
#hd{background:#262626;text-align:center;padding:10px}#hd img{height:56px;max-width:90%}

   h+='<h2>Building</h2><div class="bld"><div class="roof"></div>'+fl.slice().reverse().map(f=>fr(f.name)).join('')+'</div><div class="ground"></div><p class="m">Left bar = worst condition on that floor. Each square is one machine or tool. Tap a floor to open it.</p>'+(at('__none').length?'<h2>Not placed yet</h2>'+fr('__none'):'')}

 else if(tab==='nr')h+=`<h2>Not reported this shift (${nr.length})</h2><p class="m">Morning shift starts at midnight, afternoon at 2 PM. These items have no report since then.</p>`+(nr.map(i=>row(i,true)).join('')||'<p class="m">Everything was reported.</p>');

 <h2>Site code</h2><p class="m">Workers must enter this code first. Leave empty for no code.</p><input id="sc" inputmode="numeric" value="${esc(code)}" placeholder="Example: 4821"><button class="p" data-a="savecode">Save code</button>`;
 return h+`<div class="nop"><button data-a="refresh" style="margin-top:24px">Refresh</button><button data-a="out">Log out</button></div>`;

function render(){
 if(!ok)return;
 document.getElementById('app').innerHTML=ADMIN?admin():worker();
 const base=location.origin+location.pathname;
 document.querySelectorAll('[data-qr]').forEach(e=>{const q=qrcode(0,'M');q.addData(base+'?item='+e.dataset.qr);q.make();e.innerHTML=q.createImgTag(5)});
 document.querySelectorAll('[data-qrurl]').forEach(e=>{const q=qrcode(0,'M');q.addData(e.dataset.qrurl);q.make();e.innerHTML=q.createImgTag(8)});
 if(done)window.scrollTo(0,0);
 if(scrollEd){scrollEd=false;const e=document.getElementById('en');if(e)e.scrollIntoView({block:'center'})}
}
document.addEventListener('input',e=>{if(e.target.id==='note')d.note=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='ph'){photo=e.target.files[0]||null;render()}
 if(e.target.id==='who'&&e.target.value){name=e.target.value;render()}});
document.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(x)act(x.dataset.a,x.dataset.v)});
window.addEventListener('hashchange',()=>{ADMIN=location.hash==='#admin';load()});
async function ins(tb,row,m){const r=await sb.from(tb).insert(row);if(r.error)msg=m;return load()}
async function act(a,v){
 msg='';
 if(a==='lang')lang=lang==='en'?'es':'en';
 else if(a==='code'){const r=await sb.rpc('check_code',{c:val('cd')});if(r.data===true)codeOk=true;else msg=t('bad')}
 else if(a==='finish'){photo=null;name='';pin='';pinOk=false;done=false;queued=false;d={item:null,floor:null,cond:null,note:''}}
 else if(a==='pin'){const p=val('pn');if(!/^\d{4}$/.test(p))msg=t('wrongpin');else{const r=await sb.rpc('check_pin',{n:name,p});if((r.error&&/fetch|network|load failed/i.test(r.error.message))||r.data===true){pin=p;pinOk=true}else msg=t('wrongpin')}}
 else if(a==='editpin')ew=v;else if(a==='cancelpin')ew=null;
 else if(a==='savepin'){const p=val('ep');if(!/^\d{4}$/.test(p))msg='PIN must be 4 digits.';else{const r=await sb.from('workers').update({pin:p}).eq('id',v);msg=r.error?'Could not save.':'PIN saved.';ew=null;return load()}}
 else if(a==='item')d.item=v;else if(a==='floor')d.floor=v;else if(a==='cond')d.cond=v;
 else if(a==='again'){photo=null;done=false;d={item:null,floor:null,cond:null,note:''}}
 else if(a==='send')return send();
 else if(a==='login'){const r=await sb.auth.signInWithPassword({email:val('em'),password:val('pw')});if(r.error)msg='Wrong email or password.';return load()}
 else if(a==='out'){await sb.auth.signOut();return load()}
 else if(a==='refresh')return load();
 else if(a==='fix'){await sb.from('status').update({cond:'green',note:'',photo:null}).eq('item_id',v);return load()}
 else if(a==='tab'){tab=v;sel=null;conf=null;ed=null;ew=null}
 else if(a==='open')sel=v;else if(a==='back')sel=null;
 else if(a==='rm'||a==='rmfl'||a==='rmw'){if(conf!==v)conf=v;else{await sb.from({rm:'items',rmfl:'floors',rmw:'workers'}[a]).delete().eq('id',v);conf=null;return load()}}
 else if(a==='addfl'){const n=val('fn');if(!n)msg='Write a floor name.';else return ins('floors',{name:n,sort:Math.max(-1,...fl.map(f=>f.sort))+1},'Could not add.')}
 else if(a==='addw'){const n=val('wn');if(!n)msg='Write a name.';else return ins('workers',{name:n,pin:String(crypto.getRandomValues(new Uint16Array(1))[0]%10000).padStart(4,'0')},'Could not add.')}
 else if(a==='edit'){ed=v;tab='equip';sel=null;scrollEd=true}
 else if(a==='cancel')ed=null;
 else if(a==='save'){const n=val('en'),k=val('ek'),f=val('ef'),c=val('ec'),no=val('eno'),o=st[ed];
  if(!n)msg='Write a name.';else{const r=await sb.from('items').update({name:n,kind:k,attachments:k==='machine'?val('ea').split(',').map(x=>x.trim()).filter(Boolean):[]}).eq('id',ed);
   if(r.error)msg='Could not save.';else{if(f&&(!o||f!==o.floor||c!==o.cond||no!==(o.note||'')))await setLoc(ed,n,f,c,no);ed=null;msg='Saved.'}return load()}}
 else if(a==='add'){const n=val('nn'),k=val('nk'),f=val('nf');if(!n)msg='Write a name.';else{const r=await sb.from('items').insert({name:n,kind:k,attachments:k==='machine'?val('na').split(',').map(x=>x.trim()).filter(Boolean):[]}).select().single();if(r.error)msg='Could not add.';else if(f)await setLoc(r.data.id,n,f,'green','');return load()}}
 else if(a==='savecode'){const r=await sb.from('settings').upsert({key:'code',value:val('sc')});msg=r.error?'Could not save.':'Code saved.';return load()}
 else if(a==='export'){const r=await sb.from('reports').select('*').order('at',{ascending:false}).limit(10000);const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const csv=['Time,Equipment,Floor,Condition,Note,Worker,Shift'].concat((r.data||[]).map(x=>[fmt(x.at),x.item_name,x.floor,C[x.cond]?C[x.cond][0]:x.cond,x.note,x.by_name,x.shift].map(q).join(','))).join('\n');
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download='equipment-history.csv';l.click()}
 render();
}
const bn=m=>/fetch|network|load failed/i.test(m)?'net':m;
async function push(rec){
 try{const r=await sb.rpc('submit_report',{p_name:rec.by_name,p_pin:rec.pin,p_item:rec.item_id,p_floor:rec.floor,p_cond:rec.cond,p_note:rec.note,p_shift:rec.shift,p_at:rec.at,p_photo:rec.photo||null});
  if(r.error)return bn(r.error.message);return r.data==='ok'?null:String(r.data)}catch(e){return 'net'}
}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.7)};im.onerror=()=>res(null);im.src=URL.createObjectURL(f)})}
async function send(){busy=true;render();try{await send2()}finally{busy=false;render()}}
async function send2(){
 if(!d.item||!d.floor||!d.cond){msg=t('need');return render()}
 if(d.cond!=='green'&&!d.note.trim()){msg=t('write');return render()}
 const it=items.find(i=>i.id===d.item);
 let ph=null;if(photo&&d.cond!=='green'){try{const b=await shrink(photo);if(b){const pa=crypto.randomUUID()+'.jpg';const u=await sb.storage.from('photos').upload(pa,b,{contentType:'image/jpeg'});if(!u.error)ph=sb.storage.from('photos').getPublicUrl(pa).data.publicUrl}}catch(e){}}
 const rec={photo:ph,item_id:d.item,item_name:it?it.name:'',floor:d.floor,cond:d.cond,note:d.cond==='green'?'':d.note.trim(),by_name:name,pin:pin,shift:new Date().getHours()<14?'Morning':'Afternoon',at:new Date().toISOString()};
 queued=false;const r=await push(rec);
 if(r==='net'){const q=JSON.parse(localStorage.getItem('q')||'[]');q.push(rec);localStorage.setItem('q',JSON.stringify(q));queued=true}
 else if(r==='bad_pin'){msg=t('wrongpin');pinOk=false;return render()}
