<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{margin:0;background:#EEF0F2;color:#14181C;font:20px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:34px;margin:0 0 8px}h2{font-size:24px;margin:24px 0 10px}
button{font:600 20px system-ui,sans-serif;min-height:56px;border-radius:8px;border:2px solid #9AA3AB;background:#fff;color:#14181C;padding:0 16px;width:100%;margin-bottom:8px;text-align:left}
.sel{border:5px solid #14181C}.p{background:#1F4E79;color:#fff;border:0;text-align:center;min-height:64px}
.g{background:#1E7B3A;color:#fff;border:0}.y{background:#F2B705;border:0}.r{background:#C62828;color:#fff;border:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{text-align:center;margin:0}
input,textarea,select{width:100%;box-sizing:border-box;font:20px system-ui,sans-serif;padding:12px;border:2px solid #14181C;border-radius:8px;margin-bottom:10px}
.card{background:#fff;border:1px solid #C9CED3;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.m{color:#4A545C;font-size:16px}.big{text-align:center;font-size:28px;padding:40px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #14181C;margin-right:6px;vertical-align:middle}
</style></head><body><main id="app"></main>
<script>
// ===== PASTE YOUR VALUES HERE =====
const SUPABASE_URL='https://uizqnhzvsedqlccepucy.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpenFuaHp2c2VkcWxjY2VwdWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Njc5NDIsImV4cCI6MjEwNzE0Mzk0Mn0.mlVnCeYP6zt5oXmkjam6sC3gT4maukE6b3mF9y1YQxw';
const ALERT_URL=''; // optional: Formspree link that emails you
// ==================================
const ok=typeof supabase!=='undefined'&&!SUPABASE_URL.startsWith('PASTE')&&!SUPABASE_KEY.startsWith('PASTE');
const sb=ok?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
if(!ok)document.getElementById('app').innerHTML='<h1>Almost ready</h1><p>'+(typeof supabase==='undefined'?'The Supabase library did not load. Open this page from your GitHub link with internet.':'Open index.html in a text editor and paste your Project URL and anon key at the top (Part 2).')+'</p>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={green:['Good','#1E7B3A'],yellow:['Needs maintenance','#F2B705'],red:['Out of service','#C62828']};
let ADMIN=location.hash==='#admin',items=[],st={},sess=null,msg='',done=false,conf=null;
let d={item:null,floor:null,cond:null,note:''},name=localStorage.getItem('name')||'';
const pill=c=>c?`<span class="dot" style="background:${C[c][1]}"></span>${C[c][0]}`:'<span class="m">No report yet</span>';
async function load(){
 const a=await sb.from('items').select('*').order('name'),b=await sb.from('status').select('*');
 items=a.data||[];st={};(b.data||[]).forEach(x=>st[x.item_id]=x);
 if(ADMIN)sess=(await sb.auth.getSession()).data.session;
 render();
}
function worker(){
 if(done)return `<div class="big">✓ Done<br>Thank you</div><button class="p" data-a="again">Report another</button>`;
 if(!name)return `<h1>Your name</h1><input id="nm" placeholder="First name"><button class="p" data-a="name">Continue</button>`;
 const b=(k,cls,t)=>`<button class="${cls} ${d.cond===k?'sel':''}" data-a="cond" data-v="${k}">${t}</button>`;
 return `<h1>Hi, ${esc(name)}</h1>${msg?`<p><b>${esc(msg)}</b></p>`:''}
 <h2>1. What did you use?</h2>${items.map(i=>`<button class="${d.item===i.id?'sel':''}" data-a="item" data-v="${i.id}">${esc(i.name)}</button>`).join('')}
 <h2>2. What floor?</h2><div class="grid">${[1,2,3,4,5,6,7,8].map(f=>`<button class="${d.floor===f?'sel':''}" data-a="floor" data-v="${f}">${f}</button>`).join('')}</div>
 <h2>3. Does it work?</h2>${b('green','g','Yes')}${b('yellow','y','Needs maintenance')}${b('red','r','Out of service')}
 ${d.cond&&d.cond!=='green'?`<textarea id="note" rows="3" placeholder="What is the problem?">${esc(d.note)}</textarea>`:''}
 <button class="p" data-a="send">Send</button>`;
}
function admin(){
 if(!sess)return `<h1>Administrator</h1>${msg?`<p><b>${esc(msg)}</b></p>`:''}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="p" data-a="login">Log in</button>`;
 const bad=items.filter(i=>st[i.id]&&st[i.id].cond!=='green');
 return `<h1>Equipment status</h1>${msg?`<p><b>${esc(msg)}</b></p>`:''}
 <h2>Needs attention (${bad.length})</h2>${bad.map(i=>{const s=st[i.id];return `<div class="card" style="border-left:10px solid ${C[s.cond][1]}"><b>${esc(i.name)} · Floor ${s.floor}</b><br>${pill(s.cond)}<p>${esc(s.note)}</p><span class="m">${esc(s.by_name)} · ${new Date(s.at).toLocaleString()}</span><button data-a="fix" data-v="${i.id}" style="margin-top:8px">Mark fixed</button></div>`}).join('')||'<p class="m">Nothing needs attention.</p>'}
 <h2>All equipment</h2>${items.map(i=>{const s=st[i.id];return `<div class="card"><b>${esc(i.name)}</b> ${i.kind==='machine'?'<span class="m">('+esc((i.attachments||[]).join(', '))+')</span>':''}<br>${pill(s&&s.cond)} <span class="m">${s?'· Floor '+s.floor+' · '+esc(s.by_name):''}</span><button data-a="rm" data-v="${i.id}" style="margin-top:8px;color:#C62828;border-color:#C62828">${conf===i.id?'Tap again to remove':'Remove'}</button></div>`}).join('')}
 <h2>Add equipment</h2><select id="nk"><option value="machine">Machine</option><option value="tool">Tool</option></select><input id="nn" placeholder="Name (example: Skid steer 4)"><input id="na" placeholder="Attachments, separated by commas"><button class="p" data-a="add">Add</button>
 <button data-a="out" style="margin-top:24px">Log out</button><button data-a="refresh">Refresh</button>`;
}
function render(){document.getElementById('app').innerHTML=ADMIN?admin():worker()}
document.addEventListener('input',e=>{if(e.target.id==='note')d.note=e.target.value});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset.v)});
window.addEventListener('hashchange',()=>{ADMIN=location.hash==='#admin';load()});
const val=id=>document.getElementById(id).value.trim();
async function act(a,v){
 msg='';
 if(a==='name'){name=val('nm');if(name)localStorage.setItem('name',name)}
 else if(a==='item')d.item=v;else if(a==='floor')d.floor=+v;else if(a==='cond')d.cond=v;
 else if(a==='again'){done=false;d={item:null,floor:null,cond:null,note:''}}
 else if(a==='send')return send();
 else if(a==='login'){const r=await sb.auth.signInWithPassword({email:val('em'),password:val('pw')});if(r.error)msg='Wrong email or password.';return load()}
 else if(a==='out'){await sb.auth.signOut();return load()}
 else if(a==='refresh')return load();
 else if(a==='fix'){await sb.from('status').update({cond:'green',note:''}).eq('item_id',v);return load()}
 else if(a==='rm'){if(conf!==v){conf=v}else{await sb.from('items').delete().eq('id',v);conf=null;return load()}}
 else if(a==='add'){const n=val('nn'),k=val('nk');if(!n)msg='Write a name.';else{const r=await sb.from('items').insert({name:n,kind:k,attachments:k==='machine'?val('na').split(',').map(s=>s.trim()).filter(Boolean):[]});if(r.error)msg='Could not add.';return load()}}
 render();
}
async function send(){
 if(!d.item||!d.floor||!d.cond){msg='Choose equipment, floor, and answer the question.';return render()}
 if(d.cond!=='green'&&!d.note.trim()){msg='Please write the problem.';return render()}
 const it=items.find(i=>i.id===d.item),note=d.cond==='green'?'':d.note.trim();
 const r=await sb.from('status').upsert({item_id:d.item,floor:d.floor,cond:d.cond,note,by_name:name,at:new Date().toISOString()});
 if(r.error){msg='Could not send. Try again.';return render()}
 if(d.cond!=='green'&&ALERT_URL)fetch(ALERT_URL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({equipment:it.name,floor:d.floor,condition:C[d.cond][0],note,reported_by:name})}).catch(()=>{});
 done=true;render();
}
if(ok)load();
</script></body></html>
