<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
body{margin:0;background:#EEF0F2;color:#14181C;font:20px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:34px;margin:0 0 8px}h2{font-size:24px;margin:24px 0 10px}
button{font:600 20px system-ui,sans-serif;min-height:56px;border-radius:8px;border:2px solid #9AA3AB;background:#fff;color:#14181C;padding:0 16px;width:100%;margin-bottom:8px;text-align:left}
.sel{background:#14181C;color:#fff;border:2px solid #14181C}.dim{opacity:.4}
.p{background:#1F4E79;color:#fff;border:0;text-align:center;min-height:64px}
.g{background:#1E7B3A;color:#fff;border:0}.y{background:#F2B705;border:0}.r{background:#C62828;color:#fff;border:0}
.g.sel,.y.sel,.r.sel{border:6px solid #14181C}.y.sel{color:#14181C}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid button{text-align:center;margin:0}
input,textarea,select{width:100%;box-sizing:border-box;font:20px system-ui,sans-serif;padding:12px;border:2px solid #14181C;border-radius:8px;margin-bottom:10px}
.card{background:#fff;border:1px solid #C9CED3;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.m{color:#4A545C;font-size:16px}.big{text-align:center;font-size:28px;padding:40px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #14181C;margin-right:6px;vertical-align:middle}
.qg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.qg .card{text-align:center}
.dl{color:#C62828;border-color:#C62828;margin-top:8px}
@media print{button,.nop{display:none!important}body{background:#fff}}
</style></head><body><main id="app"></main>
<script>
// ===== PASTE YOUR VALUES HERE =====
const SUPABASE_URL='https://uizqnhzvsedqlccepucy.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpenFuaHp2c2VkcWxjY2VwdWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Njc5NDIsImV4cCI6MjEwNzE0Mzk0Mn0.mlVnCeYP6zt5oXmkjam6sC3gT4maukE6b3mF9y1YQxw';
const ALERT_URL=''; // optional: Formspree link that emails you
// ==================================
const ok=typeof supabase!=='undefined'&&!SUPABASE_URL.startsWith('PASTE')&&!SUPABASE_KEY.startsWith('PASTE');
const sb=ok?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
if(!ok)document.getElementById('app').innerHTML='<h1>Almost ready</h1><p>Paste your Project URL and anon key at the top of index.html.</p>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={green:['Good','#1E7B3A'],yellow:['Needs maintenance','#F2B705'],red:['Out of service','#C62828']};
const L={en:{name:'Your name',pick:'Tap your name',cont:'Continue',hi:'Hi, ',q1:'1. What did you use?',q2:'2. What floor?',q3:'3. Does it work?',green:'Yes',yellow:'Needs maintenance',red:'Out of service',prob:'What is the problem?',send:'Send',done:'Done',thanks:'Thank you',again:'Report another',saved:'Saved. It will be sent when you have signal.',code:'Site code',enter:'Enter',bad:'Wrong code',need:'Choose equipment, floor, and answer the question.',write:'Please write the problem.',fail:'Could not send.'},
es:{name:'Su nombre',pick:'Toque su nombre',cont:'Continuar',hi:'Hola, ',q1:'1. ¿Qué usó?',q2:'2. ¿Qué piso?',q3:'3. ¿Funciona?',green:'Sí',yellow:'Necesita mantenimiento',red:'Fuera de servicio',prob:'¿Cuál es el problema?',send:'Enviar',done:'Listo',thanks:'Gracias',again:'Reportar otro',saved:'Guardado. Se enviará cuando tenga señal.',code:'Código del sitio',enter:'Entrar',bad:'Código incorrecto',need:'Elija el equipo, el piso y responda la pregunta.',write:'Escriba el problema.',fail:'No se pudo enviar.'}};
let lang=(navigator.language||'').startsWith('es')?'es':'en';const t=k=>L[lang][k];
let ADMIN=location.hash==='#admin',items=[],st={},fl=[],wk=[],rp=[],sess=null,msg='',done=false,queued=false,conf=null,tab='floors',sel=null,need=false,codeOk=false,code='',name='';
let d={item:null,floor:null,cond:null,note:''};
const QI=new URLSearchParams(location.search).get('item');
const pill=c=>c?`<span class="dot" style="background:${C[c][1]}"></span>${C[c][0]}`:'<span class="m">No report yet</span>';
const val=id=>document.getElementById(id).value.trim(),fmt=x=>new Date(x).toLocaleString();
async function load(){
 const [a,b,c,w]=await Promise.all([sb.from('items').select('*').order('name'),sb.from('status').select('*'),sb.from('floors').select('*').order('sort'),sb.from('workers').select('*').order('name')]);
 items=a.data||[];fl=c.data||[];wk=w.data||[];st={};(b.data||[]).forEach(x=>st[x.item_id]=x);
 if(ADMIN){sess=(await sb.auth.getSession()).data.session;if(sess){rp=(await sb.from('reports').select('*').order('at',{ascending:false}).limit(100)).data||[];const s=await sb.from('settings').select('*').eq('key','code');code=s.data&&s.data[0]?s.data[0].value:''}}
 else{const r=await sb.rpc('check_code',{c:''});need=!r.error&&r.data===false;codeOk=codeOk||!need}
 if(QI&&!d.item&&items.some(i=>i.id===QI))d.item=QI;
 render();
}
function worker(){
 const lg=`<div style="text-align:right"><button data-a="lang" style="width:auto;min-height:44px;font-size:18px">${lang==='en'?'Español':'English'}</button></div>`;
 const m=msg?`<p><b>${esc(msg)}</b></p>`:'';
 if(need&&!codeOk)return lg+`<h1>${t('code')}</h1>${m}<input id="cd" inputmode="numeric" placeholder="0000"><button class="p" data-a="code">${t('enter')}</button>`;
 if(done)return lg+`<div class="big">✓ ${t('done')}<br>${t('thanks')}${queued?`<p style="font-size:18px">${t('saved')}</p>`:''}</div><button class="p" data-a="again">${t('again')}</button>`;
 if(!name)return lg+`<h1>${t('name')}</h1>`+(wk.length?`<h2>${t('pick')}</h2>`+wk.map(x=>`<button data-a="who" data-v="${esc(x.name)}">${esc(x.name)}</button>`).join(''):`<input id="nm" placeholder="${t('name')}"><button class="p" data-a="name">${t('cont')}</button>`);
 const b=(k,cls)=>`<button class="${cls} ${d.cond===k?'sel':d.cond?'dim':''}" data-a="cond" data-v="${k}">${d.cond===k?'✓ ':''}${t(k)}</button>`;
 return lg+`<h1>${t('hi')}${esc(name)}</h1>
 <h2>${t('q1')}</h2>${items.map(i=>`<button class="${d.item===i.id?'sel':''}" data-a="item" data-v="${i.id}">${esc(i.name)}</button>`).join('')}
 <h2>${t('q2')}</h2><div class="grid">${fl.map(f=>`<button class="${d.floor===f.name?'sel':''}" data-a="floor" data-v="${esc(f.name)}">${esc(f.name)}</button>`).join('')}</div>
 <h2>${t('q3')}</h2>${b('green','g')}${b('yellow','y')}${b('red','r')}
 ${d.cond&&d.cond!=='green'?`<textarea id="note" rows="3" placeholder="${t('prob')}">${esc(d.note)}</textarea>`:''}
 ${msg?`<p style="background:#fff;border:3px solid #C62828;border-radius:8px;padding:10px"><b>${esc(msg)}</b></p>`:''}<button class="p" data-a="send">${t('send')}</button>`;
}
function loc(i){const s=st[i.id];return s&&fl.some(f=>f.name===s.floor)?s.floor:null}
function row(i,sf,x){const s=st[i.id],bad=s&&s.cond!=='green';return `<div class="card"${bad?` style="border-left:10px solid ${C[s.cond][1]}"`:''}><b>${esc(i.name)}</b>${i.kind==='machine'&&(i.attachments||[]).length?` <span class="m">(${esc(i.attachments.join(', '))})</span>`:''}<br>${pill(s&&s.cond)}${s?` <span class="m">· ${sf?esc(s.floor)+' · ':''}${esc(s.by_name)} · ${fmt(s.at)}</span>`:''}${s&&s.note?`<p>${esc(s.note)}</p>`:''}${bad?`<br><button data-a="fix" data-v="${i.id}" style="margin-top:8px">Mark fixed</button>`:''}${x||''}</div>`}
const rmb=(a,id)=>`<br><button class="dl" data-a="${a}" data-v="${id}">${conf===id?'Tap again to remove':'Remove'}</button>`;
function admin(){
 if(!sess)return `<h1>Administrator</h1>${msg?`<p><b>${esc(msg)}</b></p>`:''}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="p" data-a="login">Log in</button>`;
 const s0=new Date();s0.setHours(s0.getHours()<14?0:14,0,0,0);
 const bad=items.filter(i=>st[i.id]&&st[i.id].cond!=='green'),nr=items.filter(i=>!st[i.id]||new Date(st[i.id].at)<s0);
 const T=[['floors','Floors'],['attn','Attention ('+bad.length+')'],['nr','Not reported ('+nr.length+')'],['equip','Equipment'],['hist','History'],['setup','Setup']];
 let h=`<div class="nop"><h1>Administrator</h1>${msg?`<p><b>${esc(msg)}</b></p>`:''}<div class="grid" style="margin-bottom:12px">${T.map(x=>`<button class="${tab===x[0]?'p':''}" style="text-align:center" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>`;
 const at=n=>items.filter(i=>n==='__none'?!loc(i):loc(i)===n);
 if(tab==='floors'){
  if(sel!==null){const its=at(sel);h+=`<button data-a="back">← All floors</button><h2>${sel==='__none'?'No report yet':esc(sel)} (${its.length})</h2>`+(its.map(i=>row(i,false)).join('')||'<p class="m">Nothing here.</p>')}
  else h+='<h2>Floors</h2>'+fl.map(f=>f.name).concat('__none').map(n=>{const its=at(n);if(n==='__none'&&!its.length)return '';const b=its.filter(i=>st[i.id]&&st[i.id].cond!=='green'),w=b.some(i=>st[i.id].cond==='red')?'red':'yellow';return `<button data-a="open" data-v="${esc(n)}"><b>${n==='__none'?'No report yet':esc(n)}</b> <span class="m">· ${its.length} item${its.length===1?'':'s'}</span>${b.length?`<br><span class="dot" style="background:${C[w][1]}"></span><span class="m">${b.length} need attention</span>`:''}</button>`}).join('');
 }else if(tab==='attn')h+=`<h2>Needs attention (${bad.length})</h2>`+(bad.map(i=>row(i,true)).join('')||'<p class="m">Nothing needs attention.</p>');
 else if(tab==='nr')h+=`<h2>Not reported this shift (${nr.length})</h2><p class="m">Morning shift starts at midnight, afternoon at 2 PM. These items have no report since then.</p>`+(nr.map(i=>row(i,true)).join('')||'<p class="m">Everything was reported.</p>');
 else if(tab==='equip')h+='<h2>All equipment</h2><button data-a="tab" data-v="qr">Print QR stickers</button>'+items.map(i=>row(i,true,rmb('rm',i.id))).join('')+`<h2>Add equipment</h2><select id="nk"><option value="machine">Machine</option><option value="tool">Tool</option></select><input id="nn" placeholder="Name (example: Skid steer 4)"><input id="na" placeholder="Attachments, separated by commas"><button class="p" data-a="add">Add</button>`;
 else if(tab==='qr')h+=`<div class="nop"><button data-a="tab" data-v="equip">← Back</button><button class="p" onclick="window.print()">Print</button></div><div class="qg">${items.map(i=>`<div class="card"><b>${esc(i.name)}</b><div data-qr="${i.id}"></div></div>`).join('')}</div>`;
 else if(tab==='hist')h+=`<h2>History (last 100)</h2><button data-a="export">Download all as Excel (CSV)</button>`+rp.map(r=>`<div class="card"><b>${esc(r.item_name)}</b> <span class="m">· ${esc(r.floor)}</span><br>${pill(r.cond)}<br><span class="m">${esc(r.by_name)} · ${esc(r.shift)} · ${fmt(r.at)}</span>${r.note?`<p>${esc(r.note)}</p>`:''}</div>`).join('');
 else h+='<h2>Floors</h2>'+fl.map(f=>`<div class="card"><b>${esc(f.name)}</b>${rmb('rmfl',f.id)}</div>`).join('')+`<input id="fn" placeholder="New floor (Basement, Roof, Floor 9)"><button class="p" data-a="addfl">Add floor</button>
 <h2>Crew names</h2><p class="m">Workers tap their name from this list. If empty, they type it.</p>${wk.map(x=>`<div class="card"><b>${esc(x.name)}</b>${rmb('rmw',x.id)}</div>`).join('')}<input id="wn" placeholder="Worker name"><button class="p" data-a="addw">Add worker</button>
 <h2>Site code</h2><p class="m">Workers must enter this code first. Leave empty for no code.</p><input id="sc" inputmode="numeric" value="${esc(code)}" placeholder="Example: 4821"><button class="p" data-a="savecode">Save code</button>`;
 return h+`<div class="nop"><button data-a="refresh" style="margin-top:24px">Refresh</button><button data-a="out">Log out</button></div>`;
}
function render(){
 if(!ok)return;
 document.getElementById('app').innerHTML=ADMIN?admin():worker();
 const base=location.origin+location.pathname;
 document.querySelectorAll('[data-qr]').forEach(e=>{const q=qrcode(0,'M');q.addData(base+'?item='+e.dataset.qr);q.make();e.innerHTML=q.createImgTag(5)});
 if(done)window.scrollTo(0,0);
}
document.addEventListener('input',e=>{if(e.target.id==='note')d.note=e.target.value});
document.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(x)act(x.dataset.a,x.dataset.v)});
window.addEventListener('hashchange',()=>{ADMIN=location.hash==='#admin';load()});
async function ins(tb,row,m){const r=await sb.from(tb).insert(row);if(r.error)msg=m;return load()}
async function act(a,v){
 msg='';
 if(a==='lang')lang=lang==='en'?'es':'en';
 else if(a==='code'){const r=await sb.rpc('check_code',{c:val('cd')});if(r.data===true)codeOk=true;else msg=t('bad')}
 else if(a==='who')name=v;
 else if(a==='name')name=val('nm');
 else if(a==='item')d.item=v;else if(a==='floor')d.floor=v;else if(a==='cond')d.cond=v;
 else if(a==='again'){done=false;d={item:null,floor:null,cond:null,note:''}}
 else if(a==='send')return send();
 else if(a==='login'){const r=await sb.auth.signInWithPassword({email:val('em'),password:val('pw')});if(r.error)msg='Wrong email or password.';return load()}
 else if(a==='out'){await sb.auth.signOut();return load()}
 else if(a==='refresh')return load();
 else if(a==='fix'){await sb.from('status').update({cond:'green',note:''}).eq('item_id',v);return load()}
 else if(a==='tab'){tab=v;sel=null;conf=null}
 else if(a==='open')sel=v;else if(a==='back')sel=null;
 else if(a==='rm'||a==='rmfl'||a==='rmw'){if(conf!==v)conf=v;else{await sb.from({rm:'items',rmfl:'floors',rmw:'workers'}[a]).delete().eq('id',v);conf=null;return load()}}
 else if(a==='addfl'){const n=val('fn');if(!n)msg='Write a floor name.';else return ins('floors',{name:n,sort:Math.max(-1,...fl.map(f=>f.sort))+1},'Could not add.')}
 else if(a==='addw'){const n=val('wn');if(!n)msg='Write a name.';else return ins('workers',{name:n},'Could not add.')}
 else if(a==='add'){const n=val('nn'),k=val('nk');if(!n)msg='Write a name.';else return ins('items',{name:n,kind:k,attachments:k==='machine'?val('na').split(',').map(s=>s.trim()).filter(Boolean):[]},'Could not add.')}
 else if(a==='savecode'){const r=await sb.from('settings').upsert({key:'code',value:val('sc')});msg=r.error?'Could not save.':'Code saved.';return load()}
 else if(a==='export'){const r=await sb.from('reports').select('*').order('at',{ascending:false}).limit(10000);const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const csv=['Time,Equipment,Floor,Condition,Note,Worker,Shift'].concat((r.data||[]).map(x=>[fmt(x.at),x.item_name,x.floor,C[x.cond]?C[x.cond][0]:x.cond,x.note,x.by_name,x.shift].map(q).join(','))).join('\n');
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download='equipment-history.csv';l.click()}
 render();
}
const bn=m=>/fetch|network|load failed/i.test(m)?'net':m;
async function push(rec){
 try{const {item_name,...s}=rec;
  const a=await sb.from('status').upsert(s);if(a.error)return bn(a.error.message);
  const b=await sb.from('reports').insert(rec);if(b.error)return bn(b.error.message);
  return null}catch(e){return 'net'}
}
async function send(){
 if(!d.item||!d.floor||!d.cond){msg=t('need');return render()}
 if(d.cond!=='green'&&!d.note.trim()){msg=t('write');return render()}
 const it=items.find(i=>i.id===d.item);
 const rec={item_id:d.item,item_name:it?it.name:'',floor:d.floor,cond:d.cond,note:d.cond==='green'?'':d.note.trim(),by_name:name,shift:new Date().getHours()<14?'Morning':'Afternoon',at:new Date().toISOString()};
 queued=false;const r=await push(rec);
 if(r==='net'){const q=JSON.parse(localStorage.getItem('q')||'[]');q.push(rec);localStorage.setItem('q',JSON.stringify(q));queued=true}
 else if(r){msg=t('fail')+' '+r;return render()}
 if(d.cond!=='green'&&ALERT_URL&&!queued)fetch(ALERT_URL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({equipment:rec.item_name,floor:rec.floor,condition:C[rec.cond][0],note:rec.note,reported_by:name})}).catch(()=>{});
 done=true;render();
}
async function flush(){const q=JSON.parse(localStorage.getItem('q')||'[]');if(!q.length)return;const left=[];for(const r of q){if(await push(r))left.push(r)}localStorage.setItem('q',JSON.stringify(left))}
window.addEventListener('online',flush);
if(ok){load();flush()}
</script></body></html>
